# Builds installers for Windows, macOS and Linux and publishes them as a GitHub
# release named after the version in app/src-tauri/tauri.conf.json.
#
# The release stays a draft while the six builds run and is published only
# once all of them succeed, so nobody (including the in-app update popup) sees
# a release with missing installers. If a build fails, the draft is left for
# you to fix or delete.
#
# To release: bump "version" in tauri.conf.json, commit, then either push a tag
# (git tag v0.2.0 && git push origin v0.2.0) or run this workflow from the
# Actions tab.
name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  create-release:
    runs-on: ubuntu-latest
    outputs:
      release_id: ${{ steps.release.outputs.id }}
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7

      - name: Create draft release
        id: release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          version=$(node -p "require('./app/src-tauri/tauri.conf.json').version")
          tag="v$version"
          echo "tag=$tag" >> "$GITHUB_OUTPUT"

          # Reuse a leftover draft (e.g. from a failed run); refuse to touch a published release.
          if draft=$(gh release view "$tag" --json isDraft --jq .isDraft 2>/dev/null); then
            if [ "$draft" != "true" ]; then
              echo "::error::$tag is already published. Bump \"version\" in app/src-tauri/tauri.conf.json first."
              exit 1
            fi
          else
            cat > notes.md <<'EOF'
          **Which file do I need?**
          - Windows: `…_x64-setup.exe` (or `…_arm64-setup.exe` on ARM PCs)
          - macOS: `…_aarch64.dmg` for Apple Silicon (M1 and later), `…_x64.dmg` for Intel Macs
          - Linux: `.AppImage` runs anywhere; `.deb` for Debian/Ubuntu, `.rpm` for Fedora

          The builds aren't code-signed, so the first launch needs one extra step:
          - Windows SmartScreen: **More info → Run anyway**
          - macOS: if it says the app is damaged, run `xattr -cr "/Applications/Meeting Helper.app"` once

          You also need [ffmpeg](https://ffmpeg.org/download.html) installed; the app tells you how on first start.
          EOF
            gh release create "$tag" --draft --target "$GITHUB_SHA" --title "Meeting Helper $tag" --notes-file notes.md
          fi
          echo "id=$(gh api "repos/$GITHUB_REPOSITORY/releases" --jq ".[] | select(.tag_name == \"$tag\") | .id" | head -1)" >> "$GITHUB_OUTPUT"

  build:
    name: ${{ matrix.name }}
    needs: create-release
    strategy:
      fail-fast: false
      matrix:
        include:
          - name: Windows x64
            runner: windows-latest
            args: ''
          - name: Windows ARM64
            runner: windows-11-arm
            args: ''
          - name: macOS Apple Silicon
            runner: macos-latest
            args: --target aarch64-apple-darwin
          - name: macOS Intel
            runner: macos-latest
            args: --target x86_64-apple-darwin
          - name: Linux x64
            runner: ubuntu-24.04
            args: ''
          - name: Linux ARM64
            runner: ubuntu-24.04-arm
            args: ''
    runs-on: ${{ matrix.runner }}

    steps:
      - uses: actions/checkout@v7

      - name: Install Linux build dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          # webkit/appindicator/rsvg/patchelf for Tauri; dbus for the keyring.
          sudo apt-get install -y libwebkit2gtk-4.1-dev libappindicator3-dev librsvg2-dev patchelf libdbus-1-dev

      - uses: dtolnay/rust-toolchain@stable
        with:
          # Both Mac targets build on the Apple Silicon runner.
          targets: ${{ runner.os == 'macOS' && 'aarch64-apple-darwin,x86_64-apple-darwin' || '' }}

      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: app/src-tauri -> target
          key: ${{ matrix.name }}

      - uses: oven-sh/setup-bun@v2

      - name: Install frontend dependencies
        working-directory: app
        run: bun install --frozen-lockfile

      - uses: tauri-apps/tauri-action@v1
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          projectPath: app
          tauriScript: bun run tauri
          args: ${{ matrix.args }}
          releaseId: ${{ needs.create-release.outputs.release_id }}

  publish:
    needs: [create-release, build]
    runs-on: ubuntu-latest
    steps:
      - name: Publish the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: gh release edit "${{ needs.create-release.outputs.tag }}" --repo "$GITHUB_REPOSITORY" --draft=false --latest
